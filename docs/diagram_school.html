<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagram School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky diagram index on the left, one lesson on the right; index becomes a scrolling tab row on phones.
   Look: drafting-table. Cool off-white paper, ink lines, one blueprint blue that marks "the piece you just added". */
:root{
  --paper:#f3f5f2; --card:#ffffff; --ink:#17211e; --muted:#53615b; --line:#c8d1cb;
  --accent:#1a5fb4; --accent-soft:#dce9fa; --good:#16723f; --good-soft:#dcf1e4; --bad:#b3261e; --bad-soft:#fbe4e1;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11181a; --card:#192124; --ink:#e7eeea; --muted:#9db0a9; --line:#33403c;
  --accent:#6fa8f2; --accent-soft:#1d3050; --good:#5fcb8d; --good-soft:#173528; --bad:#ff8c83; --bad-soft:#3b1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181a; --card:#192124; --ink:#e7eeea; --muted:#9db0a9; --line:#33403c;
  --accent:#6fa8f2; --accent-soft:#1d3050; --good:#5fcb8d; --good-soft:#173528; --bad:#ff8c83; --bad-soft:#3b1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0 0 2px}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
nav.idx button{font:inherit;text-align:left;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
nav.idx button:hover{background:var(--accent-soft)}
nav.idx button[aria-current="true"]{background:var(--accent);color:#fff;font-weight:700}
nav.idx .grp{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
nav.idx .done{font:700 12px var(--mono);color:var(--good)}
nav.idx button[aria-current="true"] .done{color:#fff}
main{min-width:0}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
h2{font-size:22px;margin:34px 0 10px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lede{font-size:18px;color:var(--muted);max-width:60ch}
.tag{display:inline-block;font:500 12px var(--mono);letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.move{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.move b.n{font:700 18px var(--mono);color:var(--accent);line-height:1.3}
.fig{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;min-width:520px}
figcaption{font-size:14px;color:var(--muted);padding:6px 4px 0}
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.btn{font:700 15px var(--font);border:1.5px solid var(--accent);background:var(--card);color:var(--accent);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,nav.idx button:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.dots{display:flex;gap:6px;margin-inline:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--card);padding:0;cursor:pointer}
.dot.on{background:var(--accent)}
.stepbox{border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;padding:10px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stepbox .say{font:500 13px/1.5 var(--mono);color:var(--muted);margin-bottom:6px}
.stepbox .say b{color:var(--ink)}
.stepbox .draw{margin:0}
table{border-collapse:collapse;width:100%;font-size:15px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tr:last-child td{border-bottom:0}
td code,p code,li code{font:500 13px var(--mono);background:var(--paper);padding:1px 5px;border-radius:4px}
ul.mist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.mist li{background:var(--bad-soft);border-radius:6px;padding:9px 12px;display:grid;grid-template-columns:20px 1fr;gap:8px}
ul.mist li::before{content:"✕";color:var(--bad);font-weight:700}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.q p{font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:6px;cursor:pointer;border:1.5px solid transparent;margin-bottom:4px}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-top:5px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:14px;color:var(--muted);margin:6px 0 0 4px}
.score{font:700 14px var(--mono);color:var(--good)}
.rules{display:grid;gap:8px;padding:0;list-style:none;margin:0}
.rules li{padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.pick td:first-child{width:46%}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;padding:0;text-align:left}
.themebtn{margin-top:14px;font:500 12px var(--mono);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 9px;cursor:pointer}
/* svg drawing */
svg .s{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
svg .f{fill:var(--card)}
svg .fl{fill:var(--ink);stroke:var(--ink);stroke-width:1.5}
svg .d{stroke-dasharray:6 4}
svg .t{fill:var(--ink);font:12.5px var(--font)}
svg .tb{font-weight:700}
svg .ts{font-size:11px;fill:var(--muted)}
svg .ti{font-style:italic}
svg .tu{text-decoration:underline}
svg .new .s{stroke:var(--accent);stroke-width:2.4}
svg .new .fl{fill:var(--accent);stroke:var(--accent)}
svg .new .t{fill:var(--accent)}
svg .new .ts{fill:var(--accent)}
svg .note .t{fill:var(--accent);font:500 12px var(--mono)}
svg .note .s{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
@media (min-width:821px){.swipe{display:none}}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.idx{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  nav.idx button{white-space:nowrap;border:1px solid var(--line);flex:none}
  nav.idx .grp,.brand small,.themebtn{display:none}
  .brand{flex:none;align-self:center;margin-right:6px}
}
@media (prefers-reduced-motion:no-preference){.stepbox{transition:border-color .2s}}
</style>
</head><body>
<div class="wrap"><nav class="idx" id="idx" aria-label="Diagrams"></nav><main id="main"></main></div>
<script>
/* ---------- tiny SVG drawing engine ---------- */
const E = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function txt(x, y, s, o) {
  o = o || {};
  const lines = String(s).split('\n');
  const cls = 't ' + (o.c || '');
  return '<text class="' + cls + '" x="' + x + '" y="' + y + '" text-anchor="' + (o.a || 'middle') + '">' +
    lines.map((l, i) => '<tspan x="' + x + '" dy="' + (i ? 14 : 0) + '">' + E(l) + '</tspan>').join('') + '</text>';
}
function unit(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  return [dx / L, dy / L];
}
/* arrow head / diamond at point P, pointing along unit vector u */
function head(kind, P, u) {
  const n = [-u[1], u[0]];
  const at = (k, m) => [P[0] - u[0] * k + n[0] * m, P[1] - u[1] * k + n[1] * m].map(v => v.toFixed(1)).join(',');
  if (kind === 'open') return '<polyline class="s" points="' + at(10, 5.5) + ' ' + at(0, 0) + ' ' + at(10, -5.5) + '"/>';
  if (kind === 'fill') return '<polygon class="fl" points="' + at(0, 0) + ' ' + at(11, 5) + ' ' + at(11, -5) + '"/>';
  if (kind === 'tri')  return '<polygon class="s f" points="' + at(0, 0) + ' ' + at(15, 8) + ' ' + at(15, -8) + '"/>';
  if (kind === 'dia')  return '<polygon class="s f" points="' + at(0, 0) + ' ' + at(10, 6) + ' ' + at(20, 0) + ' ' + at(10, -6) + '"/>';
  if (kind === 'diaf') return '<polygon class="fl" points="' + at(0, 0) + ' ' + at(10, 6) + ' ' + at(20, 0) + ' ' + at(10, -6) + '"/>';
  return '';
}
function ellEdge(cx, cy, rx, ry, tx, ty) {
  const dx = tx - cx, dy = ty - cy, k = 1 / Math.sqrt((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry));
  return [cx + dx * k, cy + dy * k];
}
const B = {};
B.box3d = s => {
  const d = 9, x = s.x, y = s.y, w = s.w, h = s.h;
  return '<path class="s f" d="M' + x + ' ' + y + ' L' + (x + d) + ' ' + (y - d) + ' L' + (x + w + d) + ' ' + (y - d) + ' L' + (x + w + d) + ' ' + (y + h - d) + ' L' + (x + w) + ' ' + (y + h) + '"/>' +
    '<rect class="s f" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>' +
    '<line class="s" x1="' + (x + w) + '" y1="' + y + '" x2="' + (x + w + d) + '" y2="' + (y - d) + '"/>' +
    txt(x + w / 2, y + 17, '«' + s.st + '»', {c: 'ts'}) + txt(x + w / 2, y + 33, s.name, {c: 'tb'});
};
B.artifact = s =>
  '<rect class="s f" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '"/>' +
  '<path class="s" d="M' + (s.x + s.w - 13) + ' ' + s.y + ' L' + (s.x + s.w - 13) + ' ' + (s.y + 12) + ' L' + (s.x + s.w) + ' ' + (s.y + 12) + '"/>' +
  txt(s.x + s.w / 2, s.y + 15, '«artifact»', {c: 'ts'}) + txt(s.x + s.w / 2, s.y + 30, s.name, {c: 'tb'});
B.comp = s =>
  '<rect class="s f" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '"/>' +
  '<rect class="s f" x="' + (s.x + s.w - 24) + '" y="' + (s.y + 7) + '" width="15" height="11"/>' +
  '<rect class="s f" x="' + (s.x + s.w - 28) + '" y="' + (s.y + 9) + '" width="8" height="3"/>' +
  '<rect class="s f" x="' + (s.x + s.w - 28) + '" y="' + (s.y + 14) + '" width="8" height="3"/>' +
  txt(s.x + s.w / 2, s.y + (s.h > 60 ? s.h / 2 - 4 : 16), '«component»', {c: 'ts'}) + txt(s.x + s.w / 2, s.y + (s.h > 60 ? s.h / 2 + 12 : 31), s.name, {c: 'tb'});
B.cls = s => {
  const hh = s.st ? 38 : 26, na = s.attrs ? s.attrs.length * 14 + 8 : 0, no = s.ops ? s.ops.length * 14 + 8 : 0;
  const H = hh + na + no, x = s.x, y = s.y, w = s.w;
  let o = '<rect class="s f" x="' + x + '" y="' + y + '" width="' + w + '" height="' + H + '"/>';
  if (s.st) o += txt(x + w / 2, y + 14, '«' + s.st + '»', {c: 'ts'});
  o += txt(x + w / 2, y + (s.st ? 30 : 17), s.name, {c: 'tb' + (s.abs ? ' ti' : '')});
  let yy = y + hh;
  if (s.attrs) {
    o += '<line class="s" x1="' + x + '" y1="' + yy + '" x2="' + (x + w) + '" y2="' + yy + '"/>';
    s.attrs.forEach((a, i) => { o += txt(x + 8, yy + 15 + i * 14, a, {a: 'start'}); });
    yy += na;
  }
  if (s.ops) {
    o += '<line class="s" x1="' + x + '" y1="' + yy + '" x2="' + (x + w) + '" y2="' + yy + '"/>';
    s.ops.forEach((a, i) => { o += txt(x + 8, yy + 15 + i * 14, a, {a: 'start'}); });
  }
  return o;
};
B.line = s => {
  const p = s.pts, n = p.length;
  const eu = unit(p[n - 2], p[n - 1]), su = unit(p[1], p[0]);
  let o = '<polyline class="s' + (s.dash ? ' d' : '') + '" fill="none" points="' + p.map(q => q.join(',')).join(' ') + '"/>';
  if (s.head) o += head(s.head, p[n - 1], eu);
  if (s.tail) o += head(s.tail, p[0], su);
  (s.labels || []).forEach(l => { o += txt(l.x, l.y, l.t, {a: l.a || 'middle', c: l.c || 'ts'}); });
  return o;
};
/* provided (lollipop) + required (socket) interface between two components, horizontal */
B.iface = s => {
  const dir = Math.sign(s.xp - s.xr) || 1, c = s.xr + dir * (s.k || 36), y = s.y, parts = s.parts || ['prov', 'req', 'label'];
  let o = '';
  if (parts.includes('prov')) o += '<line class="s" x1="' + s.xp + '" y1="' + y + '" x2="' + (c + dir * 7) + '" y2="' + y + '"/><circle class="s f" cx="' + c + '" cy="' + y + '" r="7"/>';
  if (parts.includes('req')) o += '<line class="s" x1="' + s.xr + '" y1="' + y + '" x2="' + (c - dir * 12) + '" y2="' + y + '"/>' +
    '<path class="s" d="M' + c + ' ' + (y - 12) + ' A12 12 0 0 ' + (dir > 0 ? 0 : 1) + ' ' + c + ' ' + (y + 12) + '"/>';
  if (parts.includes('label')) o += txt(s.lx !== undefined ? s.lx : c, s.ly !== undefined ? s.ly : y + 30, s.name, {a: s.la || 'middle', c: 'ts'});
  return o;
};
B.actor = s =>
  '<circle class="s f" cx="' + s.x + '" cy="' + s.y + '" r="8"/>' +
  '<path class="s" d="M' + s.x + ' ' + (s.y + 8) + ' V' + (s.y + 36) + ' M' + (s.x - 14) + ' ' + (s.y + 18) + ' H' + (s.x + 14) + ' M' + s.x + ' ' + (s.y + 36) + ' L' + (s.x - 12) + ' ' + (s.y + 54) + ' M' + s.x + ' ' + (s.y + 36) + ' L' + (s.x + 12) + ' ' + (s.y + 54) + '"/>' +
  txt(s.x, s.y + 72, s.name, {c: 'tb'});
B.ucase = s => '<ellipse class="s f" cx="' + s.cx + '" cy="' + s.cy + '" rx="' + s.rx + '" ry="' + s.ry + '"/>' + txt(s.cx, s.cy + 4, s.name, {c: 'tb'});
B.boundary = s => '<rect class="s f" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '"/>' + txt(s.x + s.w / 2, s.y + 20, s.name, {c: 'tb'});
B.action = s => '<rect class="s f" x="' + (s.cx - s.w / 2) + '" y="' + (s.cy - s.h / 2) + '" width="' + s.w + '" height="' + s.h + '" rx="12"/>' + txt(s.cx, s.cy + 4, s.name, {c: 'tb'});
B.state = s => '<rect class="s f" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '" rx="14"/>' + txt(s.x + s.w / 2, s.y + s.h / 2 + 4, s.name, {c: 'tb'});
B.decision = s => '<polygon class="s f" points="' + s.cx + ',' + (s.cy - s.s) + ' ' + (s.cx + s.s) + ',' + s.cy + ' ' + s.cx + ',' + (s.cy + s.s) + ' ' + (s.cx - s.s) + ',' + s.cy + '"/>';
B.bar = s => '<rect class="fl" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '" rx="2"/>';
B.init = s => '<circle class="fl" cx="' + s.cx + '" cy="' + s.cy + '" r="7"/>';
B.final = s => '<circle class="s f" cx="' + s.cx + '" cy="' + s.cy + '" r="10"/><circle class="fl" cx="' + s.cx + '" cy="' + s.cy + '" r="6"/>';
B.life = s => '<rect class="s f" x="' + (s.x - 62) + '" y="' + s.y + '" width="124" height="30"/>' + txt(s.x, s.y + 20, s.name, {c: 'tb tu'}) +
  '<line class="s d" x1="' + s.x + '" y1="' + (s.y + 30) + '" x2="' + s.x + '" y2="' + (s.y + 330) + '"/>';
B.act = s => '<rect class="s f" x="' + (s.x - 5) + '" y="' + s.y + '" width="10" height="' + s.h + '"/>';
B.obj = s => '<rect class="s f" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '"/>' + txt(s.x + s.w / 2, s.y + s.h / 2 + 4, s.name, {c: 'tb tu'});
/* message arrow drawn beside a link: label above (up) or below */
B.msg = s => {
  const u = unit([s.x1, s.y], [s.x2, s.y]);
  return '<line class="s" x1="' + s.x1 + '" y1="' + s.y + '" x2="' + s.x2 + '" y2="' + s.y + '"/>' + head('fill', [s.x2, s.y], u) +
    txt((s.x1 + s.x2) / 2, s.y + (s.below ? 18 : -7), s.label, {c: 'ts'});
};
B.note = s => txt(s.x, s.y, s.text, {a: s.a || 'start'});
B.rect = s => '<rect class="s f" x="' + s.x + '" y="' + s.y + '" width="' + s.w + '" height="' + s.h + '"/>' + txt(s.x + s.w / 2, s.y + s.h / 2 + 4, s.name, {c: 'tb'});

/* render one step; shapes whose id was not in the previous step are highlighted as "new" */
function renderSvg(vb, shapes, prevIds) {
  let o = '';
  shapes.forEach(s => {
    const isNew = !prevIds.has(s.id);
    o += '<g class="' + (s.t === 'note' ? 'note new' : (isNew ? 'new' : 'old')) + '">' + B[s.t](s) + '</g>';
  });
  return '<svg viewBox="0 0 ' + vb[0] + ' ' + vb[1] + '" xmlns="http://www.w3.org/2000/svg" role="img">' + o + '</svg>';
}
/* ---------- lessons ---------- */
const S = (id, t, p) => Object.assign({id: id, t: t}, p);
/* build cumulative steps: each step = {title, say, draw, add:[shapes], drop:[ids]}; notes last for one step only */
function build(steps) {
  let cur = [];
  return steps.map(st => {
    cur = cur.filter(s => s.t !== 'note' && !(st.drop || []).includes(s.id)).concat(st.add || []);
    return {title: st.title, say: st.say, draw: st.draw, shapes: cur.slice()};
  });
}
const ln = (id, pts, o) => S(id, 'line', Object.assign({pts: pts}, o || {}));

const D = [];

/* ===== DEPLOYMENT ===== */
D.push({
  key: 'deployment', name: 'Deployment diagram', group: 'Structure', vb: [780, 250],
  asks: 'Which machine runs which software, and how do the machines talk to each other?',
  use: 'The statement lists devices, machines, the files or programs on them, and protocols such as TLS, NFC or gRPC. It was the August 2026 modeling exercise (20 points).',
  caption: 'Hospital example: a badge, a cart and a server. Blue marks the piece added in the current step.',
  steps: build([
    {title: 'Nodes', say: '"The Smart Badge is a <b>device</b>. The Dispensing Cart is a <b>device</b>. The Pharmacy Server is a <b>machine</b>."',
     draw: 'One 3-D box per "X is a device / machine". Write the stereotype with the same word the statement uses: «device» or «machine», never «node».',
     add: [S('n1', 'box3d', {x: 14, y: 70, w: 170, h: 140, st: 'device', name: 'Smart Badge'}),
           S('n2', 'box3d', {x: 255, y: 70, w: 190, h: 140, st: 'device', name: 'Dispensing Cart'}),
           S('n3', 'box3d', {x: 598, y: 70, w: 160, h: 140, st: 'machine', name: 'Pharmacy Server'})]},

/* ---------- app ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage may be blocked */ } }
};
let done = store.get('ds:done', {});
const stepOf = {};   /* current step per diagram, default = finished diagram */

function table(head, rows, cls) {
  return '<div class="tw ' + (cls || '') + '"><table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}

function quizHtml(id, qs) {
  return '<div id="quiz-' + id + '">' + qs.map((q, i) =>
    '<div class="q" data-i="' + i + '"><p>' + (i + 1) + '. ' + q.q + '</p>' +
    q.o.map((o, j) => '<label class="opt"><input type="radio" name="' + id + '-' + i + '" value="' + j + '"><span>' + o + '</span></label>').join('') +
    '<div class="why" hidden></div></div>').join('') +
    '<p class="score" id="score-' + id + '" aria-live="polite"></p></div>';
}
function wireQuiz(id, qs, onAll) {
  const root = $('#quiz-' + id); let answered = 0, right = 0;
  root.querySelectorAll('.q').forEach(box => {
    const q = qs[+box.dataset.i];
    box.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
      const pick = +inp.value, labels = box.querySelectorAll('.opt');
      labels.forEach((l, j) => { l.querySelector('input').disabled = true; if (j === q.a) l.classList.add('right'); });
      if (pick !== q.a) labels[pick].classList.add('wrong'); else right++;
      const w = box.querySelector('.why'); w.hidden = false; w.textContent = (pick === q.a ? 'Correct. ' : 'Not quite. ') + q.why;
      answered++;
      $('#score-' + id).textContent = right + ' of ' + qs.length + ' correct' + (answered === qs.length ? (right === qs.length ? ' · perfect' : ' · reread the mistakes above') : '');
      if (answered === qs.length && onAll) onAll(right === qs.length);
    }));
  });
}

function nav(active) {
  const groups = {};
  D.forEach(d => { (groups[d.group] = groups[d.group] || []).push(d); });
  let h = '<p class="brand">Diagram School<small>UML for the ISE exam</small></p>' +
    '<button data-go="home"' + (active === 'home' ? ' aria-current="true"' : '') + '>Start here</button>';
  Object.keys(groups).forEach(g => {
    h += '<div class="grp">' + g + '</div>';
    groups[g].forEach(d => {
      h += '<button data-go="' + d.key + '"' + (active === d.key ? ' aria-current="true"' : '') + '><span>' + d.name + '</span>' + (done[d.key] ? '<span class="done" title="quiz passed">✓</span>' : '') + '</button>';
    });
  });
  h += '<button class="themebtn" id="themebtn">Light / dark</button>';
  $('#idx').innerHTML = h;
  $('#idx').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $('#themebtn').addEventListener('click', () => {
    const r = document.documentElement, dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark ? 'light' : 'dark'; store.set('ds:theme', r.dataset.theme);
  });
  const a = $('#idx [aria-current="true"]'); if (a && a.scrollIntoView && matchMedia('(max-width:820px)').matches) a.scrollIntoView({inline: 'center', block: 'nearest'});
}

function go(key) {
  if (location.hash !== '#' + key) location.hash = key; else show(key);
}

    ['Draw the boxes first.', 'Every noun you underlined becomes one box, with the exact word the statement uses.'],
    ['Add the links and label every one.', 'An unlabelled link is worth nothing: a protocol, a verb, a guard, a number, a service name.'],

  const pick = [

    ['Steps, decisions, work at the same time?', 'activity'],
    ['Who calls whom, in order, over time?', 'sequence'],
    ['Same, but with numbered messages between linked objects?', 'communication'],
    ['One object, its situations and what changes them?', 'state'],

    ['<b>Copy the statement\'s words.</b> «machine» is not «node». "Interface" is not a service name.',
     '<b>Every sentence is one element.</b> "Communicates with A and B" is two lines.',
     '<b>Nothing extra.</b> Elements that are not in the text are penalised one by one.',
     '<b>Complete or nothing.</b> "If the model is not complete we will not evaluate the elements partially."',

function lessonPage(d) {
  const last = d.steps.length - 1;
  if (stepOf[d.key] === undefined) stepOf[d.key] = last;
  $('#main').innerHTML =
    '<span class="tag">' + d.group + '</span><h1>' + d.name + '</h1>' +
    '<p class="lede">' + d.asks + '</p><p>' + d.use + '</p>' +
    '<h2>Build it, one sentence at a time</h2>' +
    '<figure class="fig" style="margin:0"><div id="svgbox"></div><figcaption>' + d.caption + '<span class="swipe"> Swipe the drawing sideways to see all of it.</span></figcaption></figure>' +
    '<div class="stepper" id="stepper"></div><div class="stepbox" id="stepbox" aria-live="polite"></div>' +
    '<h2>The notation</h2>' + table(['Element', 'Looks like', 'Means'], d.notation) +
    '<h2>Statement → what you draw</h2>' + table(['The statement says', 'You draw'], d.translate) +
    '<h2>Mistakes that cost marks</h2><ul class="mist">' + d.mist.map(m => '<li><span>' + m + '</span></li>').join('') + '</ul>' +
    '<h2>Check yourself</h2>' + quizHtml(d.key, d.quiz);
  drawStep(d);
  wireQuiz(d.key, d.quiz, ok => { if (ok) { done[d.key] = true; store.set('ds:done', done); nav(d.key); } });
}

function drawStep(d) {
  const i = stepOf[d.key], st = d.steps[i], prev = i > 0 ? new Set(d.steps[i - 1].shapes.map(s => s.id)) : new Set();
  $('#svgbox').innerHTML = renderSvg(d.vb, st.shapes, i === 0 ? new Set() : prev);
  $('#svgbox svg').setAttribute('aria-label', d.name + ', step ' + (i + 1) + ' of ' + d.steps.length + ': ' + st.title);
  $('#stepbox').innerHTML = '<div class="say">Step ' + (i + 1) + ' of ' + d.steps.length + ' · ' + st.title + '</div>' +
    '<div class="say">The statement says: <b>' + st.say + '</b></div><p class="draw"><b>Draw:</b> ' + st.draw + '</p>';
  $('#stepper').innerHTML = '<button class="btn" id="back"' + (i === 0 ? ' disabled' : '') + '>◀ Back</button>' +
    '<button class="btn pri" id="next"' + (i === d.steps.length - 1 ? ' disabled' : '') + '>Next ▶</button>' +
    '<span class="dots">' + d.steps.map((s, j) => '<button class="dot' + (j === i ? ' on' : '') + '" data-j="' + j + '" aria-label="Step ' + (j + 1) + ': ' + s.title + '"></button>').join('') + '</span>' +
    '<button class="btn" id="again">Start over</button>';
  const set = n => { stepOf[d.key] = n; drawStep(d); };
  $('#back').onclick = () => set(i - 1);
  $('#next').onclick = () => set(i + 1);
  $('#again').onclick = () => set(0);
  $('#stepper').querySelectorAll('.dot').forEach(b => b.onclick = () => set(+b.dataset.j));
}

function show(key) {
  const d = D.find(x => x.key === key);
  nav(d ? key : 'home');
  if (d) lessonPage(d); else homePage();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
(function init() {
  const t = store.get('ds:theme', null); if (t) document.documentElement.dataset.theme = t;
  show(location.hash.slice(1));
})();
</script>
</body></html>
